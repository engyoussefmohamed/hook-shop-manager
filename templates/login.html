<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-local.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/icons-local.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#eef2f7 0%,#d4e4f7 100%); }
    .login-box { width:min(440px, calc(100vw - 32px)); background:#fff; border-radius:16px; padding:36px; box-shadow:0 20px 50px rgba(15,23,42,.12); }
    .login-icon { width:72px; height:72px; border-radius:16px; background:#f0fdf4; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
    .login-icon i { font-size:2rem; color:#16a34a; }
    .login-box h4 { font-size:1.5rem; text-align:center; }
    .login-box .form-label { font-size:1.05rem; }
    .login-box .form-control { font-size:1.1rem; padding:12px 16px; }
    .login-box .btn-success { font-size:1.15rem; padding:14px; font-weight:700; }
    .pos-link { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:20px; padding:14px; border:2px solid #e2e8f0; border-radius:12px; text-decoration:none; color:#1a1f36; font-weight:700; font-size:1.05rem; transition:all .15s; }
    .pos-link:hover { border-color:#22c55e; background:#f8fff9; color:#16a34a; }
    .pos-link i { font-size:1.3rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-icon">
      <i class="bi bi-shop-window"></i>
    </div>
    <h4 class="fw-bold mb-1">مرحباً بيك</h4>
    <p class="text-muted mb-4" style="font-size:1.05rem">سجّل دخولك للمتابعة</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-danger py-2" style="font-size:1rem">
          <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label fw-semibold">اسم المستخدم</label>
      <input name="username" class="form-control mb-3" autofocus required placeholder="اكتب اسم المستخدم">
      <label class="form-label fw-semibold">كلمة المرور</label>
      <input name="password" type="password" class="form-control mb-3" required placeholder="اكتب كلمة المرور">
      <button class="btn btn-success w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>دخول
      </button>
    </form>

    <a href="{{ url_for('pos.pos') }}" class="pos-link">
      <i class="bi bi-cart3"></i>
      أبدأ البيع مباشرة بدون تسجيل دخول
    </a>
  </div>
</body>
</html>
